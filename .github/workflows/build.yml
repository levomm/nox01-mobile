name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # needed to attach the APK to a GitHub release on tags

jobs:
  # buddy-run's translation of each agent's output, on recorded runs (linux/test/run.sh); jq comes with the runner
  helper-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Test NOX01 configuration
        run: python3 scripts/test_nox01_fork.py

      - name: Test approved [01] launcher assets
        run: python3 scripts/test_nox01_launcher.py

      - name: Test NOX01 visible branding
        run: python3 scripts/test_nox01_branding.py

      - name: Test animated DOOM bubble
        run: python3 scripts/test_doom_bubble.py

      - name: Test real Tactical Neu-Dark Android UI
        run: python3 scripts/test_neu_dark_ui.py

      - name: Check permanent NOX01 signing policy
        run: python3 scripts/test_release_signing.py

      - name: Check signing setup script syntax
        run: bash -n scripts/setup_release_signing.sh

      - name: Test the helper on recorded agent output
        run: bash linux/test/run.sh

  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true # proot and libandroid-shmem (third_party/)

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      # proot, talloc, libandroid-shmem and the pty helper, from source with a fixed NDK
      - name: Build native libraries
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" >/dev/null
          ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION" native/build.sh
        env:
          NDK_VERSION: 27.2.12479018

      # Never upload an ephemeral debug-signed package. The signing identity must be
      # configured once and preserved for all future Android updates.
      - name: Require persistent signing identity
        env:
          KEYSTORE_BASE64: ${{ secrets.BUDDY_KEYSTORE_BASE64 }}
          SIGNING_PASSWORD: ${{ secrets.BUDDY_KEYSTORE_PASSWORD }}
          NOX01_SIGNING_CERT_SHA256: ${{ secrets.NOX01_SIGNING_CERT_SHA256 }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" ]] || [[ -z "$SIGNING_PASSWORD" ]] || [[ -z "$NOX01_SIGNING_CERT_SHA256" ]]; then
            echo "::error::NOX01 permanent release signing secrets missing. Refusing to publish an update-incompatible APK."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/nox01-release.p12"
          chmod 600 "$RUNNER_TEMP/nox01-release.p12"
          echo "BUDDY_KEYSTORE=$RUNNER_TEMP/nox01-release.p12" >> "$GITHUB_ENV"

      - name: Build signed release APKs
        env:
          BUDDY_KEYSTORE_PASSWORD: ${{ secrets.BUDDY_KEYSTORE_PASSWORD }}
          BUDDY_KEY_ALIAS: ${{ secrets.BUDDY_KEY_ALIAS }}
        run: ./gradlew --no-daemon assembleGithubRelease assembleFdroidRelease

      - name: Verify signed release and pinned certificate
        env:
          EXPECTED_CERT: ${{ secrets.NOX01_SIGNING_CERT_SHA256 }}
        run: |
          apk=$(find app/build/outputs/apk/github/release -name '*.apk' | head -1)
          tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          "$tools/apksigner" verify --verbose --print-certs "$apk"
          actual=$("$tools/apksigner" verify --print-certs "$apk" | sed -nE 's/^(Signer #1|V[0-9]+ Signer): certificate SHA-256 digest: //p' | head -n 1 | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')
          expected=$(printf '%s' "$EXPECTED_CERT" | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')
          test -n "$actual" && test "$actual" = "$expected" || { echo "::error::NOX01 signing certificate changed. Update rejected."; exit 1; }
          echo "NOX01 signing identity verified."

      - name: Collect APK
        run: |
          mkdir -p dist
          apk=$(find app/build/outputs/apk/github/release -name '*.apk' | head -1)
          cp "$apk" dist/nox01-mobile.apk
          fd=$(find app/build/outputs/apk/fdroid/release -name '*.apk' | head -1)
          # named so nobody picks it by mistake: it doesn't update itself (F-Droid's Binaries line must match this name)
          cp "$fd" "dist/fdroid-check-only-${GITHUB_REF_NAME//\//-}.apk"
          echo "FDROID_APK=$PWD/dist/fdroid-check-only-${GITHUB_REF_NAME//\//-}.apk" >> "$GITHUB_ENV"
          ls -l dist

      - uses: actions/upload-artifact@v7
        with:
          name: buddy-apk
          path: dist/*.apk

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        # a release made by hand first (with its own notes) just gets the CI-built APKs attached
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/nox01-mobile.apk --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/nox01-mobile.apk --title "NOX01 Mobile $GITHUB_REF_NAME" --generate-notes
          fi
      # What F-Droid will do: build the fdroid APK again, unsigned, somewhere else, and check it matches the signed one
      # above but for the signature. After publishing, so a mismatch shows up red without holding the release back.
      - uses: actions/checkout@v7
        with:
          submodules: true
          path: rebuild-check # a second copy at another path, as F-Droid's build machine would have

      - name: Check the F-Droid APK is reproducible
        # This compares signatures and requires the optional release signing key.
        # A fork without configured release signing builds unsigned release variants.
        if: env.BUDDY_KEYSTORE != ''
        run: |
          pip install --quiet apksigcopier
          export PATH="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1):$PATH" # apksigner
          cd rebuild-check
          ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018" native/build.sh
          env -u BUDDY_KEYSTORE ./gradlew --no-daemon assembleFdroidRelease
          unsigned=$(find app/build/outputs/apk/fdroid/release -name '*.apk' | head -1)
          apksigcopier compare --unsigned "$FDROID_APK" "$unsigned"
          echo "The F-Droid APK is reproducible"
