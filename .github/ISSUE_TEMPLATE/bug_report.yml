name: Veateade
description: NOX01 ei tee seda, mida peaks
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: Mis juhtus?
      description: Kirjelda toimingut, oodatud tulemust ja tegelikku tulemust.
    validations:
      required: true
  - type: input
    id: phone
    attributes:
      label: Telefon ja Androidi versioon
      placeholder: Samsung Galaxy S24+, Android
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: NOX01 versioon
      placeholder: v2.3.13
    validations:
      required: true
  - type: dropdown
    id: agent
    attributes:
      label: AI-agent
      options: [Claude Code, Codex, OpenCode, Antigravity, Grok, "Ei puuduta agenti"]
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Mudel
      placeholder: Agendi kasutatud mudel
  - type: textarea
    id: steps
    attributes:
      label: Kordamise sammud ja lisainfo
      description: Eemalda logidest, piltidelt ja tekstitest isikuandmed ning API-võtmed.
